name: Windows x64

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python for Qt installer
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Qt 6 directly
        shell: pwsh
        timeout-minutes: 20
        run: |
          python -m pip install --disable-pip-version-check "setuptools>=70.1.0" "aqtinstall==3.3.0"
          if ($LASTEXITCODE -ne 0) { throw "Failed to install aqtinstall" }

          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir "$env:RUNNER_WORKSPACE/Qt" --external 7z --timeout 30
          if ($LASTEXITCODE -ne 0) { throw "Failed to install Qt" }

          $qtRoot = "$env:RUNNER_WORKSPACE/Qt/6.8.3/msvc2022_64"
          if (-not (Test-Path "$qtRoot/bin/qmake.exe")) {
            throw "Qt installation was not found at $qtRoot"
          }

          "QT_ROOT_DIR=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$qtRoot/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          
      - name: Install native libraries
        run: vcpkg install libssh zlib --triplet x64-windows

      - name: Configure
        shell: cmd
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_PREFIX_PATH=%QT_ROOT_DIR%
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Collect application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/Release/Fluxus.exe package/

          $nativeDllNames = @(
            "ssh.dll",
            "libssh.dll",
            "zlib1.dll",
            "libcrypto-3-x64.dll",
            "libssl-3-x64.dll"
          )

          foreach ($name in $nativeDllNames) {
            $path = "C:/vcpkg/installed/x64-windows/bin/$name"
            if (Test-Path $path) {
              Copy-Item $path package/
            }
          }

          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --compiler-runtime package/Fluxus.exe

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Fluxus-Cpp-Windows-x64
          path: package/**
